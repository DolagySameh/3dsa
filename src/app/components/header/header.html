<header class="sticky top-0 z-50 bg-[#0a0a0a]/90 backdrop-blur-xl border-b border-[#262626]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <a routerLink="/" class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center shadow-lg shadow-orange-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </div>
        <div>
          <p class="text-white font-bold text-lg leading-tight">عدسة</p>
          <p class="text-neutral-500 text-xs">عالم التصوير الفوتوغرافي</p>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8">
        <a routerLink="/" routerLinkActive="text-orange-500" [routerLinkActiveOptions]="{exact:true}" class="text-neutral-300 hover:text-white transition-colors text-sm font-medium">الرئيسية</a>
        <a routerLink="/blog" routerLinkActive="text-orange-500" class="text-neutral-300 hover:text-white transition-colors text-sm font-medium">المدونة</a>
        <a routerLink="/about" routerLinkActive="text-orange-500" class="text-neutral-300 hover:text-white transition-colors text-sm font-medium">من نحن</a>
      </nav>

      <a routerLink="/blog" class="hidden md:inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 text-white text-sm font-semibold shadow-lg shadow-orange-500/20 hover:shadow-orange-500/40 transition-all">
        ابدأ القراءة
        <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </a>

      <button class="md:hidden text-white" (click)="toggle()" aria-label="menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  @if (mobileOpen()) {
    <div class="md:hidden border-t border-[#262626] bg-[#0a0a0a] px-4 py-4 space-y-2">
      <a routerLink="/" (click)="close()" class="block text-neutral-300 hover:text-white py-2">الرئيسية</a>
      <a routerLink="/blog" (click)="close()" class="block text-neutral-300 hover:text-white py-2">المدونة</a>
      <a routerLink="/about" (click)="close()" class="block text-neutral-300 hover:text-white py-2">من نحن</a>
    </div>
  }
</header>
